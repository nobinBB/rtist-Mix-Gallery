<style>
:root { --bg:#f5f5f2; --panel:rgba(245,245,242,.88); --card:#fff; --text:#171717; --sub:#777; --line:rgba(0,0,0,.075); --shadow:0 14px 38px rgba(0,0,0,.12); }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; background:radial-gradient(circle at 10% 0%, rgba(255,255,255,.95), transparent 34rem), var(--bg); color:var(--text); font-family:Inter,"Segoe UI","Noto Sans JP",system-ui,sans-serif; }
header { position:sticky; top:0; z-index:20; background:var(--panel); backdrop-filter:blur(18px); border-bottom:1px solid var(--line); }
.header-inner { width:min(1800px,100%); margin:0 auto; padding:15px 24px; display:flex; align-items:center; gap:12px; }
.title { font-size:19px; font-weight:800; letter-spacing:.02em; white-space:nowrap; }
.random-button { flex:0 0 auto; padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--text); font-size:12px; font-weight:650; cursor:pointer; box-shadow:0 2px 10px rgba(0,0,0,.035); }
.random-button:hover { background:#efefec; }
.counter { color:var(--sub); font-size:13px; white-space:nowrap; }
.search { margin-left:auto; width:min(430px,48vw); padding:11px 15px; border:1px solid var(--line); border-radius:999px; outline:none; background:#fff; font-size:14px; box-shadow:0 2px 14px rgba(0,0,0,.04); }
.search:focus { border-color:rgba(0,0,0,.23); box-shadow:0 0 0 4px rgba(0,0,0,.04); }
main { width:min(1800px,100%); margin:0 auto; padding:24px; }
.gallery { column-width:245px; column-gap:18px; }
.card { display:inline-block; width:100%; margin:0 0 18px; break-inside:avoid; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:0 2px 12px rgba(0,0,0,.035); transition:transform .18s ease,box-shadow .18s ease; }
.card:hover { transform:translateY(-2px); box-shadow:var(--shadow); }
.image-wrap { display:block; width:100%; padding:0; border:0; background:transparent; cursor:zoom-in; }
.image-wrap img { display:block; width:100%; height:auto; background:#ececea; }
.info { display:flex; align-items:center; gap:8px; padding:10px 11px 11px 13px; }
.filename { flex:1; min-width:0; padding:5px 0; border:0; background:transparent; color:var(--text); font:inherit; font-size:13px; line-height:1.35; text-align:left; overflow-wrap:anywhere; cursor:copy; }
.filename:hover { text-decoration:underline; text-underline-offset:3px; }
.copy { flex:0 0 auto; padding:6px 9px; border:1px solid var(--line); border-radius:999px; background:#f7f7f5; color:#555; font-size:11px; cursor:pointer; }
.copy:hover { background:#ececea; }
.hidden { display:none !important; }
.toast { position:fixed; left:50%; bottom:24px; z-index:100; opacity:0; transform:translateX(-50%) translateY(18px); padding:10px 16px; border-radius:999px; background:rgba(18,18,18,.93); color:#fff; font-size:13px; pointer-events:none; transition:.2s ease; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.lightbox { position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center; padding:30px; background:rgba(0,0,0,.86); backdrop-filter:blur(8px); }
.lightbox.open { display:flex; }
.lightbox-box { max-width:min(95vw,1500px); max-height:92vh; display:flex; flex-direction:column; align-items:center; gap:12px; }
.lightbox img { max-width:100%; max-height:calc(92vh - 58px); object-fit:contain; border-radius:12px; box-shadow:0 20px 80px rgba(0,0,0,.45); }
.lightbox-name { padding:8px 13px; border:0; border-radius:999px; background:rgba(255,255,255,.14); color:#fff; font-size:13px; cursor:copy; }
@media (max-width:700px) { .header-inner { padding:12px; flex-wrap:wrap; } .search { order:4; width:100%; margin-left:0; } main { padding:12px; } .gallery { column-width:150px; column-gap:12px; } .card { margin-bottom:12px; border-radius:14px; } }
</style>
</head>

<div class="toast" id="toast">コピーしました</div>
<div class="lightbox" id="lightbox"><div class="lightbox-box"><img id="lightboxImage" src="" alt=""><button class="lightbox-name" id="lightboxName" type="button"></button></div></div>
<script>
const search=document.getElementById("search"); const gallery=document.getElementById("gallery"); const visibleCount=document.getElementById("visibleCount"); const toast=document.getElementById("toast"); const randomButton=document.getElementById("randomButton"); const lightbox=document.getElementById("lightbox"); const lightboxImage=document.getElementById("lightboxImage"); const lightboxName=document.getElementById("lightboxName"); let toastTimer=null;
function getCards(){ return Array.from(gallery.querySelectorAll(".card")); }
function showToast(text){ toast.textContent=text; toast.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toast.classList.remove("show"),1200); }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); } catch(error){ const box=document.createElement("textarea"); box.value=text; box.style.position="fixed"; box.style.opacity="0"; document.body.appendChild(box); box.select(); document.execCommand("copy"); box.remove(); } showToast("「"+text+"」をコピーしました"); }
document.addEventListener("click",event=>{ const copyTarget=event.target.closest("[data-copy]"); if(copyTarget){ copyText(copyTarget.dataset.copy); return; } const imageButton=event.target.closest(".image-wrap"); if(imageButton){ const src=imageButton.dataset.src; const name=imageButton.dataset.name; lightboxImage.src=src; lightboxImage.alt=name; lightboxName.textContent=name; lightboxName.dataset.copyName=name; lightbox.classList.add("open"); document.body.style.overflow="hidden"; } });
lightboxName.addEventListener("click",()=>copyText(lightboxName.dataset.copyName||""));
function closeLightbox(){ lightbox.classList.remove("open"); document.body.style.overflow=""; lightboxImage.src=""; }
lightbox.addEventListener("click",event=>{ if(event.target===lightbox) closeLightbox(); });
document.addEventListener("keydown",event=>{ if(event.key==="Escape"&&lightbox.classList.contains("open")) closeLightbox(); if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==="f"){ event.preventDefault(); search.focus(); search.select(); } });
search.addEventListener("input",()=>{ const query=search.value.trim().toLowerCase(); let count=0; getCards().forEach(card=>{ const matched=!query||card.dataset.search.includes(query); card.classList.toggle("hidden",!matched); if(matched) count++; }); visibleCount.textContent=count; });
randomButton.addEventListener("click",()=>{ const cards=getCards(); for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [cards[i],cards[j]]=[cards[j],cards[i]]; } cards.forEach(card=>gallery.appendChild(card)); showToast("並び順をランダムにしました"); });
</script>
